# Realistic access token fixtures for testing
alice_web_token:
  token: alice_web_access_token_1234567890abcdef
  refresh_token: alice_web_refresh_token_1234567890abcdef
  expires_at: <%= 1.hour.from_now %>
  scopes: openid profile email
  application: web_app
  user: alice
  created_at: <%= 1.hour.ago %>
  updated_at: <%= 1.hour.ago %>

bob_mobile_token:
  token: bob_mobile_access_token_abcdef1234567890
  refresh_token: bob_mobile_refresh_token_abcdef1234567890
  expires_at: <%= 30.minutes.from_now %>
  scopes: openid profile email
  application: mobile_app
  user: bob
  created_at: <%= 30.minutes.ago %>
  updated_at: <%= 30.minutes.ago %>

# Expired token for testing
expired_token:
  token: expired_access_token_1234567890abcdef
  refresh_token: expired_refresh_token_1234567890abcdef
  expires_at: <%= 1.hour.ago %>
  scopes: openid profile email
  application: web_app
  user: alice
  created_at: <%= 2.hours.ago %>
  updated_at: <%= 2.hours.ago %>